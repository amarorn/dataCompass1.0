apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: datacompass-python-ingress
  namespace: datacompass-python
  labels:
    app: datacompass-python
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - datacompass-python.yourdomain.com
    secretName: datacompass-python-tls
  rules:
  - host: datacompass-python.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: datacompass-python-service
            port:
              number: 80
      - path: /webhook
        pathType: Prefix
        backend:
          service:
            name: datacompass-python-service
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: datacompass-python-service
            port:
              number: 80