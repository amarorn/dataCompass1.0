apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: datacompass-python-network-policy
  namespace: datacompass-python
  labels:
    app: datacompass-python
spec:
  podSelector:
    matchLabels:
      app: datacompass-python
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8000
  - from:
    - podSelector:
        matchLabels:
          app: datacompass-python
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: mongodb
    ports:
    - protocol: TCP
      port: 27017
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
    - protocol: UDP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongodb-network-policy
  namespace: datacompass-python
  labels:
    app: mongodb
spec:
  podSelector:
    matchLabels:
      app: mongodb
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: datacompass-python
    ports:
    - protocol: TCP
      port: 27017
  egress:
  - to: []
    ports:
    - protocol: UDP
      port: 53