version: '3.8'

services:
  app:
    build: .
    container_name: datacompass-python
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - WHATSAPP_TOKEN=${WHATSAPP_TOKEN}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_WEBHOOK_VERIFY_TOKEN=${WHATSAPP_WEBHOOK_VERIFY_TOKEN}
      - WHATSAPP_WEBHOOK_SECRET=${WHATSAPP_WEBHOOK_SECRET}
      - MONGODB_HOST=mongodb
      - MONGODB_PORT=27017
      - MONGODB_DATABASE=whatsapp_analytics
    depends_on:
      - mongodb
    networks:
      - datacompass-network
    restart: unless-stopped

  mongodb:
    image: mongo:6-jammy
    container_name: datacompass-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin123
      - MONGO_INITDB_DATABASE=whatsapp_analytics
    volumes:
      - mongodb-data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    networks:
      - datacompass-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: datacompass-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - datacompass-network
    restart: unless-stopped

networks:
  datacompass-network:
    driver: bridge

volumes:
  mongodb-data:
  redis-data:
